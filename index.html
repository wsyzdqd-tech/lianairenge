function computeDims(){
  const sums=Array(dims.length).fill(0),ws=Array(dims.length).fill(0);
  qs.forEach((q,i)=>{
    const a=answers[i];if(a===null||a===undefined)return;
    if(q.t==="s"){
      const x=(safe(a)-1)/4;
      for(const d of Object.keys(q.w||{})){
        const di=Number(d),ww=safe(q.w[d]);
        if(di>=0&&di<14&&Number.isFinite(ww)){sums[di]+=x*ww;ws[di]+=Math.abs(ww)}
      }
    }else{
      const raw=q.o?.[a]||[]; const vec=(raw[2] && typeof raw[2]==="object") ? raw[2] : ((raw[1] && typeof raw[1]==="object") ? raw[1] : {});
      for(const d of Object.keys(vec)){
        const di=Number(d),ww=safe(vec[d]);
        if(di>=0&&di<14&&Number.isFinite(ww)){sums[di]+=ww;ws[di]+=1}
      }
    }
  });
  return sums.map((v,i)=>ws[i]>0?Math.round(clamp((v/ws[i])*100)):0);
}

function typeScore(s,w){
  let a=0,b=0;
  for(const k of Object.keys(w)){const ww=safe(w[k]);if(!ww)continue;a+=safe(s[Number(k)])*ww;b+=Math.abs(ww)}
  return b?Math.round(clamp(a/b)):0;
}

function drawRadar(s){
  const svg=el("radar");svg.innerHTML="";
  const cx=320,cy=320,R=220,n=s.length;
  const pts=r=>s.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]});
  for(const r of [.2,.4,.6,.8,1]){
    const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    poly.setAttribute("points",pts(r).map(p=>p.join(",")).join(" "));poly.setAttribute("class","r-grid");svg.appendChild(poly);
  }
  pts(1).forEach(p=>{
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",cx);line.setAttribute("y1",cy);line.setAttribute("x2",p[0]);line.setAttribute("y2",p[1]);line.setAttribute("class","r-axis");svg.appendChild(line);
  });
  const data=s.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*clamp(v)/100;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]});
  const area=document.createElementNS("http://www.w3.org/2000/svg","polygon");
  area.setAttribute("points",data.map(p=>p.join(",")).join(" "));area.setAttribute("class","r-area");svg.appendChild(area);
  pts(1.18).forEach((p,i)=>{
    const anchor=p[0]<cx-20?"end":p[0]>cx+20?"start":"middle";
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",p[0]);t.setAttribute("y",p[1]);t.setAttribute("text-anchor",anchor);t.setAttribute("dominant-baseline","middle");t.setAttribute("class","r-label");t.textContent=dims[i].n;svg.appendChild(t);
    const v=document.createElementNS("http://www.w3.org/2000/svg","text");
    v.setAttribute("x",p[0]);v.setAttribute("y",p[1]+17);v.setAttribute("text-anchor",anchor);v.setAttribute("class","r-value");v.textContent=s[i];svg.appendChild(v);
  });
}

    </div>
  `).join("");

  el("profileTitle").textContent=`${types[main.i].name} · 核心画像`;
  el("profileText").textContent=types[main.i].text;
  el("tags").innerHTML=types[main.i].tags.map(x=>`<span class="tag">${x}</span>`).join("");

  const loveSpeed=s[0]>=70?"行动型：喜欢就会靠近":s[5]>=70?"上头型：情绪先行":"观察型：先确认再投入";
  const conflict=s[7]>=70?"边界优先：吵架也要保留空间":s[0]>=70?"解决优先：问题最好马上说清楚":"情绪优先：先处理感受再处理问题";
  const hidden=s[8]>=70?"反差很大：恋爱后容易暴露另一个自己":s[9]>=70?"防御感较强：你不会一次交出全部":"相对直接：喜欢与不喜欢比较容易被看出来";
  const fatal=s[11]>=70?"刺激感":s[10]>=70?"被偏爱":s[5]>=70?"情绪投入":s[13]>=70?"自由空间":"确定感";

  el("insight").innerHTML=[
    ["你的恋爱节奏",loveSpeed],
    ["吵架模式",conflict],
    ["隐藏属性",hidden],
    ["最容易上头的点",fatal],
    ["一句话总结",`你不是不会恋爱，你只是会用自己的方式把关系变得很有戏。核心人格是「${types[main.i].name}」，但真正决定你恋爱风格的，是 ${dims[s.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v)[0].i].n}。`]
  ].map(r=>`<div class="insight-row"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join("");

  el("quizView").classList.add("hidden");
  el("resultView").classList.remove("hidden");
  el("topBack").classList.add("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

el("nextBtn").onclick=()=>{
  if(answers[idx]===null)return;
  if(idx<qs.length-1){idx++;renderQuestion();window.scrollTo({top:0,behavior:"smooth"})}
  else showResults();
};
el("prevBtn").onclick=()=>{
  if(idx>0){idx--;renderQuestion();window.scrollTo({top:0,behavior:"smooth"})}
};
el("topBack").onclick=()=>{
  if(idx>0){idx--;renderQuestion();window.scrollTo({top:0,behavior:"smooth"})}
};
el("restartBtn").onclick=()=>location.reload();
el("shareBtn").onclick=async()=>{
  const txt=`我的恋爱人格是「${el("mainType").textContent}」｜你是什么类型？`;
  if(navigator.share){
    try{await navigator.share({title:"你的恋爱人格是什么？",text:txt,url:location.href})}catch(e){}
  }else{
    try{await navigator.clipboard.writeText(txt+" "+location.href);alert("结果文案已复制")}
    catch(e){alert(txt)}
  }
};
renderQuestion();
</script>
</body>
</html>
